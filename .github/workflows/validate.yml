name: Validate client settings

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --alluredir=allure-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: settings-allure-results
          path: allure-results
